# n8n (pinned) + postgres, a one-shot service that imports every file in ./workflows with the n8n CLI,
# and the mock help-desk/metrics API the templates call.
#
#   cp .env.example .env   # then set N8N_ENCRYPTION_KEY and POSTGRES_PASSWORD
#   docker compose up -d --build
#   open http://localhost:5678
#
# The import keeps each workflow's id, so re-running it updates the same workflows instead of adding copies.
name: n8n-agentic-workflows

x-n8n: &n8n
  image: n8nio/n8n:${N8N_VERSION:-1.80.0}
  environment:
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: postgres
    DB_POSTGRESDB_PORT: "5432"
    DB_POSTGRESDB_DATABASE: n8n
    DB_POSTGRESDB_USER: n8n
    DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
    GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
    TZ: ${GENERIC_TIMEZONE:-UTC}
    WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
    N8N_SECURE_COOKIE: "false"          # plain http on localhost; remove behind TLS
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"   # the templates read the variables below with $env
    HELPDESK_API_URL: ${HELPDESK_API_URL:-http://mock-services:8080}
    METRICS_API_URL: ${METRICS_API_URL:-http://mock-services:8080}
    CRM_SHEET_ID: ${CRM_SHEET_ID:-}
    SUPPORT_LOG_SHEET_ID: ${SUPPORT_LOG_SHEET_ID:-}
    ERROR_LOG_SHEET_ID: ${ERROR_LOG_SHEET_ID:-}
    SCHEDULING_CALENDAR_ID: ${SCHEDULING_CALENDAR_ID:-primary}
  volumes:
    - n8n_data:/home/node/.n8n

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: n8n
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 3s
      retries: 20

  n8n-import:
    <<: *n8n
    command: ["import:workflow", "--separate", "--input=/workflows"]
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  n8n:
    <<: *n8n
    ports: ["5678:5678"]
    depends_on:
      postgres:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully
      mock-services:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null || exit 1"]
      interval: 5s
      retries: 30

  mock-services:
    build: .
    image: n8n-agentic-workflows/mock-services:latest
    environment:
      MOCK_API_KEY: ${MOCK_API_KEY:-}
    ports: ["8080:8080"]

volumes:
  pg_data:
  n8n_data:
