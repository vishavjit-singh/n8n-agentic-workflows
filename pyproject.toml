[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "n8n-agentic-workflows"
version = "1.0.0"
description = "Importable n8n workflow templates (LLM lead qualification, support triage agent, meeting scheduler, KPI digest, error handler) with a linter, graph renderer, local simulator and docs generator."
authors = [{ name = "Vishavjit Singh Saini" }]
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
n8nkit = "n8nkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
